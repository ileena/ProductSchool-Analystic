<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1470 830" width="1470" height="830" font-family="Inter, Helvetica, Arial, sans-serif">
<rect width="1470" height="830" fill="#FFFFFF"/>
<text x="44" y="50" font-size="24" fill="#0F2540" font-weight="700" text-anchor="start" font-style="normal">The Mechanic — Forecast Confidence</text>
<text x="44" y="78" font-size="14" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">A weekly refresh habit built on decay, not points. The thing the user stands to lose is the accuracy of a forecast they already depend on.</text>
<rect x="44" y="130" width="490" height="120" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<rect x="44" y="130" width="6" height="120" rx="3" fill="#2563EB"/>
<text x="66" y="156" font-size="10.5" fill="#2563EB" font-weight="700" text-anchor="start" font-style="normal" letter-spacing="1.4">TRIGGER</text>
<text x="66" y="180" font-size="13.5" fill="#0F2540" font-weight="700" text-anchor="start" font-style="normal">Monday 08:00 — confidence has decayed</text>
<text x="66" y="201" font-size="11" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">“Your forecast is 6 days old. Confidence</text>
<text x="66" y="217" font-size="11" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">71%. Twenty seconds to refresh.” Weekly,</text>
<text x="66" y="233" font-size="11" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">because SMB owners think in payroll weeks.</text>
<line x1="289.0" y1="250" x2="289.0" y2="272" stroke="#E2E8F0" stroke-width="2.5"/>
<path d="M 283.0 266 L 289.0 276 L 295.0 266 Z" fill="#64748B"/>
<rect x="44" y="280" width="490" height="120" rx="12" fill="#FFFFFF" stroke="#0E9F8E" stroke-width="2"/>
<rect x="44" y="280" width="6" height="120" rx="3" fill="#0E9F8E"/>
<text x="66" y="306" font-size="10.5" fill="#0E9F8E" font-weight="700" text-anchor="start" font-style="normal" letter-spacing="1.4">ACTION</text>
<text x="66" y="330" font-size="13.5" fill="#0F2540" font-weight="700" text-anchor="start" font-style="normal">One tap. The forecast re-runs.</text>
<text x="66" y="351" font-size="11" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">No budgeting, no data entry, no decisions.</text>
<text x="66" y="367" font-size="11" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">The action is small enough to survive a</text>
<text x="66" y="383" font-size="11" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">genuinely terrible week at the business.</text>
<line x1="289.0" y1="400" x2="289.0" y2="422" stroke="#E2E8F0" stroke-width="2.5"/>
<path d="M 283.0 416 L 289.0 426 L 295.0 416 Z" fill="#64748B"/>
<rect x="44" y="430" width="490" height="120" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
<rect x="44" y="430" width="6" height="120" rx="3" fill="#D97706"/>
<text x="66" y="456" font-size="10.5" fill="#D97706" font-weight="700" text-anchor="start" font-style="normal" letter-spacing="1.4">VARIABLE REWARD</text>
<text x="66" y="480" font-size="13.5" fill="#0F2540" font-weight="700" text-anchor="start" font-style="normal">What changed since last Monday</text>
<text x="66" y="501" font-size="11" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">Runway extended or shortened, a collection</text>
<text x="66" y="517" font-size="11" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">landed, a new cost risk surfaced. The user</text>
<text x="66" y="533" font-size="11" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">cannot predict it, so it stays worth opening.</text>
<line x1="289.0" y1="550" x2="289.0" y2="572" stroke="#E2E8F0" stroke-width="2.5"/>
<path d="M 283.0 566 L 289.0 576 L 295.0 566 Z" fill="#64748B"/>
<rect x="44" y="580" width="490" height="120" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
<rect x="44" y="580" width="6" height="120" rx="3" fill="#7C3AED"/>
<text x="66" y="606" font-size="10.5" fill="#7C3AED" font-weight="700" text-anchor="start" font-style="normal" letter-spacing="1.4">INVESTMENT</text>
<text x="66" y="630" font-size="13.5" fill="#0F2540" font-weight="700" text-anchor="start" font-style="normal">Confirm three unknown transactions</text>
<text x="66" y="651" font-size="11" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">Raises their confidence score AND trains the</text>
<text x="66" y="667" font-size="11" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">shared categorisation model — the same loop</text>
<text x="66" y="683" font-size="11" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">that drives acquisition in M1.</text>
<path d="M 289.0 700 L 289.0 726 L 20 726 L 20 190 L 34 190" fill="none" stroke="#E2E8F0" stroke-width="2.5" stroke-dasharray="6 6"/>
<path d="M 32 184 L 43 190 L 32 196 Z" fill="#64748B"/>
<text x="305.0" y="746" font-size="11" fill="#64748B" font-weight="400" text-anchor="middle" font-style="italic">confidence decays again over the week — the trigger renews itself</text>
<text x="620" y="130" font-size="11" fill="#64748B" font-weight="700" text-anchor="start" font-style="normal" letter-spacing="1.4">WIREFRAME — THE MECHANIC IN CONTEXT</text>
<rect x="620" y="180" width="244" height="470" rx="20" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<rect x="621.5" y="181.5" width="241" height="28" rx="18" fill="#F8FAFC"/>
<text x="636" y="200" font-size="10" fill="#64748B" font-weight="700" text-anchor="start" font-style="normal">FinWise</text>
<text x="848" y="200" font-size="9" fill="#64748B" font-weight="400" text-anchor="end" font-style="normal">Mon 08:00</text>
<text x="620" y="144" font-size="13" fill="#0F2540" font-weight="700" text-anchor="start" font-style="normal">A · Trigger</text>
<text x="620" y="162" font-size="11" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">Monday email + in-app banner</text>
<rect x="636" y="230" width="212" height="60" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
<text x="648" y="252" font-size="9.5" fill="#DC2626" font-weight="700" text-anchor="start" font-style="normal" letter-spacing="1.2">CONFIDENCE DECAYING</text>
<text x="648" y="274" font-size="11.5" fill="#0F2540" font-weight="700" text-anchor="start" font-style="normal">71% · forecast is 6 days old</text>
<circle cx="742.0" cy="360" r="42" fill="none" stroke="#E2E8F0" stroke-width="7"/>
<circle cx="742.0" cy="360" r="42" fill="none" stroke="#D97706" stroke-width="7" stroke-linecap="round" stroke-dasharray="187.4 263.9" transform="rotate(-90 742.0 360)"/>
<text x="742.0" y="367" font-size="18" fill="#0F2540" font-weight="700" text-anchor="middle" font-style="normal">71%</text>
<text x="742.0" y="422" font-size="11" fill="#64748B" font-weight="400" text-anchor="middle" font-style="normal">Forecast confidence</text>
<circle cx="650" cy="450" r="3.5" fill="#D97706"/>
<text x="664" y="454" font-size="10.5" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">3 unknown transactions</text>
<circle cx="650" cy="474" r="3.5" fill="#D97706"/>
<text x="664" y="478" font-size="10.5" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">2 invoices unreconciled</text>
<circle cx="650" cy="498" r="3.5" fill="#D97706"/>
<text x="664" y="502" font-size="10.5" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">6 days of new activity</text>
<rect x="636" y="584" width="212" height="42" rx="10" fill="#2563EB"/>
<text x="742.0" y="610" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-style="normal">Refresh · 20 seconds</text>
<rect x="904" y="180" width="244" height="470" rx="20" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<rect x="905.5" y="181.5" width="241" height="28" rx="18" fill="#F8FAFC"/>
<text x="920" y="200" font-size="10" fill="#64748B" font-weight="700" text-anchor="start" font-style="normal">FinWise</text>
<text x="1132" y="200" font-size="9" fill="#64748B" font-weight="400" text-anchor="end" font-style="normal">Mon 08:00</text>
<text x="904" y="144" font-size="13" fill="#0F2540" font-weight="700" text-anchor="start" font-style="normal">B · Variable reward</text>
<text x="904" y="162" font-size="11" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">What changed this week</text>
<text x="922" y="240" font-size="14" fill="#0F2540" font-weight="700" text-anchor="start" font-style="normal">Since last Monday</text>
<rect x="920" y="254" width="212" height="74" rx="12" fill="#ECFDF5" stroke="#0E9F8E" stroke-width="2.5"/>
<text x="932" y="276" font-size="9.5" fill="#0E9F8E" font-weight="700" text-anchor="start" font-style="normal" letter-spacing="1.2">RUNWAY MOVED</text>
<text x="932" y="302" font-size="16" fill="#0F2540" font-weight="700" text-anchor="start" font-style="normal">Week 9 → Week 14</text>
<text x="932" y="320" font-size="10" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">the $14,200 landed</text>
<rect x="920" y="338" width="212" height="62" rx="10" fill="#FFF7ED" stroke="#D97706" stroke-width="1.4"/>
<text x="932" y="359" font-size="9.5" fill="#D97706" font-weight="700" text-anchor="start" font-style="normal" letter-spacing="1.2">NEW RISK</text>
<text x="932" y="378" font-size="11.5" fill="#0F2540" font-weight="700" text-anchor="start" font-style="normal">Supplier cost up 22%</text>
<text x="932" y="393" font-size="9.5" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">recurring, starts next month</text>
<rect x="920" y="410" width="212" height="54" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.4"/>
<text x="932" y="430" font-size="9.5" fill="#64748B" font-weight="700" text-anchor="start" font-style="normal" letter-spacing="1.2">UNCHANGED</text>
<text x="932" y="450" font-size="11" fill="#0F2540" font-weight="400" text-anchor="start" font-style="normal">Payroll clears every week</text>
<text x="922" y="488" font-size="9.5" fill="#64748B" font-weight="400" text-anchor="start" font-style="italic">changes every week — that is the point</text>
<rect x="920" y="584" width="212" height="42" rx="10" fill="#0E9F8E"/>
<text x="1026.0" y="610" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-style="normal">Model the supplier increase</text>
<rect x="1188" y="180" width="244" height="470" rx="20" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<rect x="1189.5" y="181.5" width="241" height="28" rx="18" fill="#F8FAFC"/>
<text x="1204" y="200" font-size="10" fill="#64748B" font-weight="700" text-anchor="start" font-style="normal">FinWise</text>
<text x="1416" y="200" font-size="9" fill="#64748B" font-weight="400" text-anchor="end" font-style="normal">Mon 08:00</text>
<text x="1188" y="144" font-size="13" fill="#0F2540" font-weight="700" text-anchor="start" font-style="normal">C · Investment</text>
<text x="1188" y="162" font-size="11" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">One tap that improves the model</text>
<text x="1206" y="240" font-size="13.5" fill="#0F2540" font-weight="700" text-anchor="start" font-style="normal">Three we couldn't place</text>
<text x="1206" y="258" font-size="10" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">Confirming these lifts your score.</text>
<rect x="1204" y="272" width="212" height="52" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.4"/>
<text x="1216" y="292" font-size="10.5" fill="#0F2540" font-weight="700" text-anchor="start" font-style="normal">NORTHGATE SUPPLIES</text>
<text x="1216" y="308" font-size="9.5" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">Cost of goods</text>
<text x="1404" y="300" font-size="11" fill="#0F2540" font-weight="700" text-anchor="end" font-style="normal">$1,840</text>
<rect x="1204" y="334" width="212" height="52" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.4"/>
<text x="1216" y="354" font-size="10.5" fill="#0F2540" font-weight="700" text-anchor="start" font-style="normal">AWS EMEA</text>
<text x="1216" y="370" font-size="9.5" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">Software</text>
<text x="1404" y="362" font-size="11" fill="#0F2540" font-weight="700" text-anchor="end" font-style="normal">$312</text>
<rect x="1204" y="396" width="212" height="52" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.4"/>
<text x="1216" y="416" font-size="10.5" fill="#0F2540" font-weight="700" text-anchor="start" font-style="normal">REF 88213 INBOUND</text>
<text x="1216" y="432" font-size="9.5" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">Customer payment</text>
<text x="1404" y="424" font-size="11" fill="#0F2540" font-weight="700" text-anchor="end" font-style="normal">$4,100</text>
<rect x="1204" y="464" width="212" height="66" rx="10" fill="#ECFDF5" stroke="#0E9F8E" stroke-width="1.4"/>
<text x="1216" y="486" font-size="13" fill="#0E9F8E" font-weight="700" text-anchor="start" font-style="normal">Confidence → 96%</text>
<text x="1216" y="504" font-size="9.5" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">and every FinWise forecast gets</text>
<text x="1216" y="518" font-size="9.5" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">slightly better at reading these.</text>
<rect x="1204" y="584" width="212" height="42" rx="10" fill="#2563EB"/>
<text x="1310.0" y="610" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-style="normal">Confirm all three</text>
<rect x="620" y="700" width="812" height="84" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.4"/>
<text x="638" y="724" font-size="10" fill="#B91C1C" font-weight="700" text-anchor="start" font-style="normal" letter-spacing="1.3">DESIGN GUARDRAIL</text>
<text x="638" y="746" font-size="11" fill="#0F2540" font-weight="400" text-anchor="start" font-style="normal">Confidence measures data freshness only — never financial performance. A month of bad cash flow must never</text>
<text x="638" y="764" font-size="11" fill="#0F2540" font-weight="400" text-anchor="start" font-style="normal">lower a user's score. Punishing an owner for a hard quarter is how a finance product loses the customer it exists to help.</text>
</svg>
