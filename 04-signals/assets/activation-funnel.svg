<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" width="1440" height="760" font-family="Inter, Helvetica, Arial, sans-serif"><rect width="1440" height="760" fill="#FFFFFF"/><text x="44" y="50" font-size="23" fill="#0F2540" font-weight="700" text-anchor="start" font-style="normal">The Signals — FinWise doesn't have a conversion problem, it has an import problem</text><text x="44" y="78" font-size="13.5" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">Monthly trial cohort, n = 12,000. Illustrative figures consistent with the scenario: 2% trial-to-paid, 40% one-year paid retention.</text><text x="44" y="120" font-size="11" fill="#64748B" font-weight="700" text-anchor="start" font-style="normal" letter-spacing="1.4">TRIAL FUNNEL</text><text x="44" y="156" font-size="13.5" fill="#0F2540" font-weight="700" text-anchor="start" font-style="normal">Started trial</text><text x="664" y="156" font-size="11.5" fill="#64748B" font-weight="400" text-anchor="end" font-style="normal">12,000 users</text><rect x="44" y="166" width="620" height="30" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.4"/><rect x="44" y="166" width="620" height="30" rx="6" fill="#2563EB"/><text x="58" y="186" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="start" font-style="normal">100%</text><text x="44" y="240" font-size="13.5" fill="#0F2540" font-weight="700" text-anchor="start" font-style="normal">Completed account setup</text><text x="664" y="240" font-size="11.5" fill="#64748B" font-weight="400" text-anchor="end" font-style="normal">9,120 users</text><rect x="44" y="250" width="620" height="30" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.4"/><rect x="44" y="250" width="471.2" height="30" rx="6" fill="#2563EB"/><text x="58" y="270" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="start" font-style="normal">76%</text><text x="682" y="270" font-size="13" fill="#64748B" font-weight="700" text-anchor="start" font-style="normal">76%</text><text x="728" y="270" font-size="10" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">step</text><text x="44" y="324" font-size="13.5" fill="#0F2540" font-weight="700" text-anchor="start" font-style="normal">Imported financial data</text><text x="664" y="324" font-size="11.5" fill="#64748B" font-weight="400" text-anchor="end" font-style="normal">3,360 users</text><rect x="44" y="334" width="620" height="30" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.4"/><rect x="44" y="334" width="173.6" height="30" rx="6" fill="#DC2626"/><text x="58" y="354" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="start" font-style="normal">28%</text><text x="682" y="354" font-size="13" fill="#DC2626" font-weight="700" text-anchor="start" font-style="normal">37%</text><text x="728" y="354" font-size="10" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">step</text><text x="44" y="408" font-size="13.5" fill="#0F2540" font-weight="700" text-anchor="start" font-style="normal">Reached first modeling output</text><text x="664" y="408" font-size="11.5" fill="#64748B" font-weight="400" text-anchor="end" font-style="normal">2,640 users</text><rect x="44" y="418" width="620" height="30" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.4"/><rect x="44" y="418" width="136.4" height="30" rx="6" fill="#2563EB"/><text x="58" y="438" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="start" font-style="normal">22%</text><text x="682" y="438" font-size="13" fill="#64748B" font-weight="700" text-anchor="start" font-style="normal">79%</text><text x="728" y="438" font-size="10" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">step</text><text x="44" y="492" font-size="13.5" fill="#0F2540" font-weight="700" text-anchor="start" font-style="normal">Converted to paid</text><text x="664" y="492" font-size="11.5" fill="#64748B" font-weight="400" text-anchor="end" font-style="normal">240 users</text><rect x="44" y="502" width="620" height="30" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.4"/><rect x="44" y="502" width="12.4" height="30" rx="6" fill="#64748B"/><text x="68.4" y="522" font-size="13" fill="#0F2540" font-weight="700" text-anchor="start" font-style="normal">2%</text><text x="682" y="522" font-size="13" fill="#64748B" font-weight="700" text-anchor="start" font-style="normal">9%</text><text x="728" y="522" font-size="10" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">step</text><path d="M 225.6 376 l -6 -9 l -6 9 Z" fill="#DC2626"/><text x="239.6" y="382" font-size="12" fill="#DC2626" font-weight="700" text-anchor="start" font-style="normal">THE GATE — 5,760 users lost in one step.</text><rect x="720" y="120" width="676" height="250" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.4"/><text x="742" y="150" font-size="11" fill="#64748B" font-weight="700" text-anchor="start" font-style="normal" letter-spacing="1.3">TRIAL TO PAID, SPLIT BY WHETHER THE AHA WAS REACHED</text><line x1="786" y1="302" x2="1366" y2="302" stroke="#E2E8F0" stroke-width="1"/><text x="774" y="306" font-size="10" fill="#64748B" font-weight="400" text-anchor="end" font-style="normal">0%</text><line x1="786" y1="271.5" x2="1366" y2="271.5" stroke="#E2E8F0" stroke-width="1"/><text x="774" y="275.5" font-size="10" fill="#64748B" font-weight="400" text-anchor="end" font-style="normal">2.5%</text><line x1="786" y1="241" x2="1366" y2="241" stroke="#E2E8F0" stroke-width="1"/><text x="774" y="245" font-size="10" fill="#64748B" font-weight="400" text-anchor="end" font-style="normal">5%</text><line x1="786" y1="210.5" x2="1366" y2="210.5" stroke="#E2E8F0" stroke-width="1"/><text x="774" y="214.5" font-size="10" fill="#64748B" font-weight="400" text-anchor="end" font-style="normal">7.5%</text><line x1="786" y1="180" x2="1366" y2="180" stroke="#E2E8F0" stroke-width="1"/><text x="774" y="184" font-size="10" fill="#64748B" font-weight="400" text-anchor="end" font-style="normal">10%</text><rect x="842" y="200.7" width="108" height="101.3" rx="6" fill="#0E9F8E"/><text x="896" y="188.7" font-size="16" fill="#0F2540" font-weight="700" text-anchor="middle" font-style="normal">8.3%</text><text x="896" y="324" font-size="11.5" fill="#0F2540" font-weight="700" text-anchor="middle" font-style="normal">Reached first output</text><text x="896" y="340" font-size="10" fill="#64748B" font-weight="400" text-anchor="middle" font-style="normal">219 / 2,640</text><rect x="1018" y="299.6" width="108" height="2.4" rx="6" fill="#DC2626"/><text x="1072" y="287.6" font-size="16" fill="#0F2540" font-weight="700" text-anchor="middle" font-style="normal">0.2%</text><text x="1072" y="324" font-size="11.5" fill="#0F2540" font-weight="700" text-anchor="middle" font-style="normal">Did not reach it</text><text x="1072" y="340" font-size="10" fill="#64748B" font-weight="400" text-anchor="middle" font-style="normal">21 / 9,360</text><rect x="1194" y="277.6" width="108" height="24.4" rx="6" fill="#94A3B8"/><text x="1248" y="265.6" font-size="16" fill="#0F2540" font-weight="700" text-anchor="middle" font-style="normal">2%</text><text x="1248" y="324" font-size="11.5" fill="#0F2540" font-weight="700" text-anchor="middle" font-style="normal">Blended</text><text x="1248" y="340" font-size="10" fill="#64748B" font-weight="400" text-anchor="middle" font-style="normal">240 / 12,000</text><text x="1366" y="150" font-size="13" fill="#0E9F8E" font-weight="700" text-anchor="end" font-style="normal">40x gap</text><rect x="720" y="392" width="676" height="148" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.4"/><text x="742" y="420" font-size="11" fill="#64748B" font-weight="700" text-anchor="start" font-style="normal" letter-spacing="1.3">ONE-YEAR PAID RETENTION, BY MODELING CADENCE IN MONTH 1</text><text x="742" y="458" font-size="12" fill="#0F2540" font-weight="700" text-anchor="start" font-style="normal">3 or more outputs</text><rect x="930" y="442" width="350" height="22" rx="5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.4"/><rect x="930" y="442" width="217" height="22" rx="5" fill="#0E9F8E"/><text x="1296" y="459" font-size="13.5" fill="#0F2540" font-weight="700" text-anchor="start" font-style="normal">62%</text><text x="742" y="500" font-size="12" fill="#0F2540" font-weight="700" text-anchor="start" font-style="normal">Fewer than 3</text><rect x="930" y="484" width="350" height="22" rx="5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.4"/><rect x="930" y="484" width="84" height="22" rx="5" fill="#DC2626"/><text x="1296" y="501" font-size="13.5" fill="#0F2540" font-weight="700" text-anchor="start" font-style="normal">24%</text><text x="742" y="526" font-size="11.5" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">The habit, not the purchase, is what retains. This is what M3 is built to move.</text><rect x="720" y="562" width="676" height="156" rx="10" fill="#ECFDF5" stroke="#0E9F8E" stroke-width="1.4"/><text x="742" y="590" font-size="10.5" fill="#0E9F8E" font-weight="700" text-anchor="start" font-style="normal" letter-spacing="1.3">WHAT THE DATA ACTUALLY SAYS</text><text x="742" y="616" font-size="11.5" fill="#0F2540" font-weight="700" text-anchor="start" font-style="normal">2% trial-to-paid reads like a pricing or sales problem. It is neither.</text><text x="742" y="636" font-size="11.5" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">72% of trials never import their own data, so the product never gets</text><text x="742" y="656" font-size="11.5" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">the chance to prove anything. Among those who do reach a first modeling</text><text x="742" y="676" font-size="11.5" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">output, 8.3% convert - a 40x difference on one behaviour.</text><text x="742" y="696" font-size="11.5" fill="#0F2540" font-weight="700" text-anchor="start" font-style="normal">71% of trials that ever import do so in session one. After day 3, only 5% do.</text><text x="44" y="738" font-size="12" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">Instrumentation: trial_started, setup_completed, data_import_started/succeeded/failed, modeling_output_viewed, forecast_shared - each stamped with time-since-trial-start.</text></svg>