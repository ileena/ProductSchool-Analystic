<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 880" width="1440" height="880" font-family="Inter, Helvetica, Arial, sans-serif"><rect width="1440" height="880" fill="#FFFFFF"/><text x="44" y="50" font-size="24" fill="#0F2540" font-weight="700" text-anchor="start" font-style="normal">Reading another team's A/B result — the call I would make</text><text x="44" y="78" font-size="14" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">A result landed on my desk from another FinWise team. n = 20 (10 per arm). Nothing reaches significance — and that is the finding.</text><rect x="44" y="120" width="500" height="400" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.4"/><text x="66" y="150" font-size="11" fill="#64748B" font-weight="700" text-anchor="start" font-style="normal" letter-spacing="1.3">PRIMARY METRIC · CONVERSION RATE</text><line x1="114" y1="420" x2="514" y2="420" stroke="#E2E8F0" stroke-width="1"/><text x="102" y="424" font-size="10" fill="#64748B" font-weight="400" text-anchor="end" font-style="normal">0%</text><line x1="114" y1="359.5" x2="514" y2="359.5" stroke="#E2E8F0" stroke-width="1"/><text x="102" y="363.5" font-size="10" fill="#64748B" font-weight="400" text-anchor="end" font-style="normal">25%</text><line x1="114" y1="299" x2="514" y2="299" stroke="#E2E8F0" stroke-width="1"/><text x="102" y="303" font-size="10" fill="#64748B" font-weight="400" text-anchor="end" font-style="normal">50%</text><line x1="114" y1="238.5" x2="514" y2="238.5" stroke="#E2E8F0" stroke-width="1"/><text x="102" y="242.5" font-size="10" fill="#64748B" font-weight="400" text-anchor="end" font-style="normal">75%</text><line x1="114" y1="178" x2="514" y2="178" stroke="#E2E8F0" stroke-width="1"/><text x="102" y="182" font-size="10" fill="#64748B" font-weight="400" text-anchor="end" font-style="normal">100%</text><rect x="184" y="250.6" width="96" height="169.4" rx="6" fill="#94A3B8"/><text x="232" y="280.6" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-style="normal">70%</text><text x="232" y="444" font-size="12.5" fill="#0F2540" font-weight="700" text-anchor="middle" font-style="normal">A · control</text><text x="232" y="462" font-size="10.5" fill="#64748B" font-weight="400" text-anchor="middle" font-style="normal">7 of 10 converted</text><text x="232" y="478" font-size="10.5" fill="#64748B" font-weight="400" text-anchor="middle" font-style="normal">95% CI 40–89%</text><line x1="306" y1="323.2" x2="306" y2="204.6" stroke="#0F2540" stroke-width="2.5"/><line x1="295" y1="323.2" x2="317" y2="323.2" stroke="#0F2540" stroke-width="2.5"/><line x1="295" y1="204.6" x2="317" y2="204.6" stroke="#0F2540" stroke-width="2.5"/><rect x="374" y="274.8" width="96" height="145.2" rx="6" fill="#2563EB"/><text x="422" y="304.8" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-style="normal">60%</text><text x="422" y="444" font-size="12.5" fill="#0F2540" font-weight="700" text-anchor="middle" font-style="normal">B · treatment</text><text x="422" y="462" font-size="10.5" fill="#64748B" font-weight="400" text-anchor="middle" font-style="normal">6 of 10 converted</text><text x="422" y="478" font-size="10.5" fill="#64748B" font-weight="400" text-anchor="middle" font-style="normal">95% CI 31–83%</text><line x1="496" y1="345" x2="496" y2="219.1" stroke="#0F2540" stroke-width="2.5"/><line x1="485" y1="345" x2="507" y2="345" stroke="#0F2540" stroke-width="2.5"/><line x1="485" y1="219.1" x2="507" y2="219.1" stroke="#0F2540" stroke-width="2.5"/><text x="520" y="150" font-size="10" fill="#64748B" font-weight="400" text-anchor="end" font-style="normal">95% Wilson CI</text><text x="66" y="490" font-size="11.5" fill="#DC2626" font-weight="700" text-anchor="start" font-style="normal">Difference −10pp · Fisher exact p = 1</text><text x="66" y="508" font-size="11" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">95% CI on the difference: −52pp to +32pp. It contains zero.</text><rect x="580" y="120" width="816" height="400" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.4"/><text x="602" y="150" font-size="11" fill="#64748B" font-weight="700" text-anchor="start" font-style="normal" letter-spacing="1.3">CONVERSION BY TRAFFIC SOURCE</text><line x1="650" y1="420" x2="1366" y2="420" stroke="#E2E8F0" stroke-width="1"/><text x="638" y="424" font-size="10" fill="#64748B" font-weight="400" text-anchor="end" font-style="normal">0%</text><line x1="650" y1="359.5" x2="1366" y2="359.5" stroke="#E2E8F0" stroke-width="1"/><text x="638" y="363.5" font-size="10" fill="#64748B" font-weight="400" text-anchor="end" font-style="normal">25%</text><line x1="650" y1="299" x2="1366" y2="299" stroke="#E2E8F0" stroke-width="1"/><text x="638" y="303" font-size="10" fill="#64748B" font-weight="400" text-anchor="end" font-style="normal">50%</text><line x1="650" y1="238.5" x2="1366" y2="238.5" stroke="#E2E8F0" stroke-width="1"/><text x="638" y="242.5" font-size="10" fill="#64748B" font-weight="400" text-anchor="end" font-style="normal">75%</text><line x1="650" y1="178" x2="1366" y2="178" stroke="#E2E8F0" stroke-width="1"/><text x="638" y="182" font-size="10" fill="#64748B" font-weight="400" text-anchor="end" font-style="normal">100%</text><rect x="690" y="238.5" width="74" height="181.5" rx="6" fill="#94A3B8"/><rect x="778" y="178" width="74" height="242" rx="6" fill="#2563EB"/><text x="727" y="228.5" font-size="13" fill="#0F2540" font-weight="700" text-anchor="middle" font-style="normal">75%</text><text x="815" y="168" font-size="13" fill="#0F2540" font-weight="700" text-anchor="middle" font-style="normal">100%</text><text x="727" y="440" font-size="10" fill="#64748B" font-weight="400" text-anchor="middle" font-style="normal">3/4</text><text x="815" y="440" font-size="10" fill="#64748B" font-weight="400" text-anchor="middle" font-style="normal">4/4</text><text x="771" y="464" font-size="12.5" fill="#0F2540" font-weight="700" text-anchor="middle" font-style="normal">Organic</text><text x="771" y="482" font-size="12" fill="#0E9F8E" font-weight="700" text-anchor="middle" font-style="normal">+25pp</text><rect x="910" y="340.1" width="74" height="79.9" rx="6" fill="#94A3B8"/><rect x="998" y="420" width="74" height="0" rx="6" fill="#2563EB"/><text x="947" y="330.1" font-size="13" fill="#0F2540" font-weight="700" text-anchor="middle" font-style="normal">33%</text><text x="1035" y="410" font-size="13" fill="#0F2540" font-weight="700" text-anchor="middle" font-style="normal">0%</text><text x="947" y="440" font-size="10" fill="#64748B" font-weight="400" text-anchor="middle" font-style="normal">1/3</text><text x="1035" y="440" font-size="10" fill="#64748B" font-weight="400" text-anchor="middle" font-style="normal">0/3</text><text x="991" y="464" font-size="12.5" fill="#0F2540" font-weight="700" text-anchor="middle" font-style="normal">Paid</text><text x="991" y="482" font-size="12" fill="#DC2626" font-weight="700" text-anchor="middle" font-style="normal">−33pp</text><rect x="1130" y="178" width="74" height="242" rx="6" fill="#94A3B8"/><rect x="1218" y="257.9" width="74" height="162.1" rx="6" fill="#2563EB"/><text x="1167" y="168" font-size="13" fill="#0F2540" font-weight="700" text-anchor="middle" font-style="normal">100%</text><text x="1255" y="247.9" font-size="13" fill="#0F2540" font-weight="700" text-anchor="middle" font-style="normal">67%</text><text x="1167" y="440" font-size="10" fill="#64748B" font-weight="400" text-anchor="middle" font-style="normal">3/3</text><text x="1255" y="440" font-size="10" fill="#64748B" font-weight="400" text-anchor="middle" font-style="normal">2/3</text><text x="1211" y="464" font-size="12.5" fill="#0F2540" font-weight="700" text-anchor="middle" font-style="normal">Referral</text><text x="1211" y="482" font-size="12" fill="#DC2626" font-weight="700" text-anchor="middle" font-style="normal">−33pp</text><rect x="1106" y="140" width="14" height="14" rx="3" fill="#94A3B8"/><text x="1128" y="152" font-size="11" fill="#0F2540" font-weight="400" text-anchor="start" font-style="normal">A · control</text><rect x="1251" y="140" width="14" height="14" rx="3" fill="#2563EB"/><text x="1273" y="152" font-size="11" fill="#0F2540" font-weight="400" text-anchor="start" font-style="normal">B · treatment</text><text x="602" y="508" font-size="11.5" fill="#D97706" font-weight="700" text-anchor="start" font-style="normal">Hypothesis-generating only — 3 to 4 users per cell; one user flipping moves a cell by 25–33pp.</text><rect x="44" y="552" width="336" height="240" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.4"/><rect x="44" y="552" width="6" height="240" rx="3" fill="#0E9F8E"/><text x="68" y="582" font-size="10.5" fill="#0E9F8E" font-weight="700" text-anchor="start" font-style="normal" letter-spacing="1.3">SESSION DURATION</text><text x="68" y="618" font-size="21" fill="#0F2540" font-weight="700" text-anchor="start" font-style="normal">180s → 207s</text><text x="68" y="644" font-size="13" fill="#0E9F8E" font-weight="700" text-anchor="start" font-style="normal">+27s  (+15%)</text><text x="68" y="676" font-size="11.5" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">Welch t = 1.2 · p = 0.2</text><text x="68" y="696" font-size="11.5" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">Cohen's d = 0.5 — a moderate effect</text><text x="68" y="716" font-size="11.5" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">Power at n=10: 21%. Needs 55/arm.</text><line x1="68" y1="748" x2="356" y2="748" stroke="#E2E8F0" stroke-width="1"/><text x="68" y="770" font-size="11" fill="#0F2540" font-weight="700" text-anchor="start" font-style="normal">The strongest directional signal in the dataset.</text><rect x="412" y="552" width="336" height="240" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.4"/><rect x="412" y="552" width="6" height="240" rx="3" fill="#64748B"/><text x="436" y="582" font-size="10.5" fill="#64748B" font-weight="700" text-anchor="start" font-style="normal" letter-spacing="1.3">FEATURE ENGAGEMENT</text><text x="436" y="618" font-size="21" fill="#0F2540" font-weight="700" text-anchor="start" font-style="normal">56.3% → 57.9%</text><text x="436" y="644" font-size="13" fill="#64748B" font-weight="700" text-anchor="start" font-style="normal">+1.6pp</text><text x="436" y="676" font-size="11.5" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">Welch t = 0.2 · p = 0.8</text><text x="436" y="696" font-size="11.5" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">Cohen's d = 0.1 — negligible</text><text x="436" y="716" font-size="11.5" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">Indistinguishable from no effect.</text><line x1="436" y1="748" x2="724" y2="748" stroke="#E2E8F0" stroke-width="1"/><text x="436" y="770" font-size="11" fill="#0F2540" font-weight="700" text-anchor="start" font-style="normal">No signal, and no reason to expect one at this n.</text><rect x="780" y="552" width="336" height="240" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.4"/><rect x="780" y="552" width="6" height="240" rx="3" fill="#DC2626"/><text x="804" y="582" font-size="10.5" fill="#DC2626" font-weight="700" text-anchor="start" font-style="normal" letter-spacing="1.3">STATISTICAL POWER</text><text x="804" y="618" font-size="21" fill="#0F2540" font-weight="700" text-anchor="start" font-style="normal">10 per arm</text><text x="804" y="644" font-size="13" fill="#DC2626" font-weight="700" text-anchor="start" font-style="normal">620 needed</text><text x="804" y="676" font-size="11.5" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">A +7pp MDE needs ~620 per arm</text><text x="804" y="696" font-size="11.5" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">Power on the observed result: 6.8%</text><text x="804" y="716" font-size="11.5" fill="#64748B" font-weight="400" text-anchor="start" font-style="normal">Even 70% → 100% reaches only 54%</text><line x1="804" y1="748" x2="1092" y2="748" stroke="#E2E8F0" stroke-width="1"/><text x="804" y="770" font-size="11" fill="#0F2540" font-weight="700" text-anchor="start" font-style="normal">The sample is ~62x short of what it needed.</text><rect x="44" y="812" width="1352" height="56" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.4"/><text x="66" y="836" font-size="12.5" fill="#991B1B" font-weight="700" text-anchor="start" font-style="normal">DECISION — ITERATE. Do not ship, do not kill.</text><text x="66" y="856" font-size="12" fill="#0F2540" font-weight="400" text-anchor="start" font-style="normal">A non-significant result here is not evidence of no effect; it is evidence of an underpowered test. Re-run at ~620 per arm before any ship decision.</text></svg>